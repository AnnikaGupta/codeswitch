[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeswitch-agent"
version = "0.1.0"
description = "Deep research agent exploring demographic-conditioned conversational style shift in LLMs, over a self-generated counterfactual benchmark"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "mcp>=1.0.0",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "requests>=2.31",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits real Anthropic/OpenAI/Ollama APIs -- costs quota, slower, non-deterministic. Run explicitly with -m integration.",
]
addopts = "-m 'not integration'"

[tool.setuptools]
py-modules = ["app"]
packages = ["agent"]
