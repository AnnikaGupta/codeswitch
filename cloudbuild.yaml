steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/codeswitch/codeswitch:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/codeswitch/codeswitch:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - codeswitch
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/codeswitch/codeswitch:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --allow-unauthenticated
      - --timeout=300
      - --quiet
options:
  logging: CLOUD_LOGGING_ONLY
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/codeswitch/codeswitch:$COMMIT_SHA
